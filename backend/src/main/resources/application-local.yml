    url: jdbc:mysql://localhost:3306/ai_chat?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: meng050319

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.aichat.dto
  configuration:
    map-underscore-to-camel-case: true

# MCP 服务器不再写死在这里：改为配置驱动的注册中心（config/mcp-servers.json），
# 可在前端「设置 - MCP 服务器」里增删改、热重载。联网搜索由本地 SearXNG MCP 提供（已去除智谱）。
app:
  # config 目录与项目根：留空自动推断（后端工作目录为 backend/ 时取其父目录）
  project-root: ""
  config-dir: config

memos:
  enabled: true
  base-url: http://localhost:8000
  api-key: ""
  connect-timeout-ms: 3000
  read-timeout-ms: 120000
  # 固定的 Memos user_id（UUID 格式）—— 纯个人项目，所有对话共享同一用户
  user-id: "8736b16e-1d20-4163-980b-a5063c3facdc"
  # 搜索 top_k：Memos 默认 10，比旧值 3 大以利用 Memos 的去重和排序
  search-top-k: 10
  async-mode: sync
  # 全局默认 cube（Memos 官方隔离单元，见 https://memos-docs.openmem.net/open_source/modules/mem_cube ）
  # 角色可在 role_card.memos_cube_id 覆盖；每角色独立 cube 需在 Memos 侧先 register_mem_cube
  writable-cube-ids: "b32d0977-435d-4828-a86f-4f47f8b55bca"
  readable-cube-ids: "b32d0977-435d-4828-a86f-4f47f8b55bca"
  # 多角色时默认只读 session_id=role_{roleId} 的记忆；true 则兼容旧 default_session 数据
  include-legacy-memories: false
  # 搜索模式：fast（快，仅 working_memory）/ fine（精细，全量 vector+graph）/ mixture（混合，推荐）
  search-mode: mixture
  # 相关性阈值：低于此值的记忆不返回，0 = 不过滤
  relativity: 0.4
  # 是否包含用户偏好记忆
  include-preference: true
  pref-top-k: 6
  # Memos 搜索去重策略：mmr 更适合多条角色记忆，避免相似事实重复占满上下文
  dedup: mmr
  search-tool-memory: true
  tool-mem-top-k: 6
  include-skill-memory: true
  skill-mem-top-k: 3
  search-history-messages: 12
  # 接近 Memos chat 的 query+answer 写回；如发现 assistant 话术污染用户事实，可在前端关闭
  save-assistant-turns: true
  fallback-to-rag: true

rag:
  max-context-chars: 2400
  min-similarity-score: 0.60
  embedding-batch-size: 32
  # RAG 启动策略：
  #   true  = 启动时若 Redis 缓存为空，则后台异步向量化（不阻塞应用启动），
  #            首次提问到达时若仍未完成则同步等待最多 30s；之后命中 Redis 缓存秒级就绪
  #   false = 只读 Redis；缓存为空就让 RAG 一直空索引，需手动 POST /api/rag/reload
  # 默认 true：项目所有角色卡 + 长期记忆都依赖 RAG，关闭等于"忘记角色设定"
  eager-init: true
  # 启动时是否强制重建 RAG 缓存：
  #   true（默认）= 每次启动都后台异步重新扫描 personas/*/lore + memory_cards 并向量化，
  #                 新结果完成后无缝替换内存索引；
  #                 启动期会先用 Redis 旧缓存垫底，避免重建中检索全空
  #   false       = 走旧逻辑：Redis 命中即停，未命中再视 eager-init 决定是否预热
  # 开发期改 persona/memory_cards 后重启就能生效，不需要再 POST /api/rag/reload
  force-rebuild-on-startup: true

llm:
  # Win 机 LM Studio (Gemma4-31B Dense, GGUF Q4/Q5, ctx_len=8192)，OpenAI 兼容；规则强约束：LLM 必须走 Win
  # 上下文长度策略：后端自管 prompt 装配，发到 LLM 的 token 控制在 7K 内，LM Studio 侧 ctx_len 配 8K 即可（不要拉到 256K）
  base-url: http://127.0.0.1:1234/v1
  model-name: gemma4-e4b
  streaming-model-name: gemma-4-31b-it
  # 连接超时给短一点，连不上秒失败；读超时给大模型留够吐字时间
  connect-timeout-ms: 3000
  read-timeout-ms: 60000
  # 出错重试；langchain4j 默认 3 次，收敛到 1 次避免启动期日志刷屏
  max-retries: 1

embedding:
  # 严格约束：Embedding 必须常驻 Mac（Win 显存被 Gemma4-31B 占满，不能再叠加 GPU 服务）
  # 当前使用 Mac 本机 LM Studio 的 Qwen3 Embedding GGUF。
  # 见 .joycode/rules/00-hardware-and-deployment.md
  base-url: http://127.0.0.1:1234/v1
  model-name: text-embedding-qwen3-embedding-4b

voice:
  # SenseVoice 本机批处理接口（PLAN-002 已部署，launchd 托管）
  asr-url: http://127.0.0.1:9000/v1/audio/transcriptions
  asr-language: auto
  asr-timeout-ms: 15000
  # ---------------- TTS 引擎 ----------------
  # Astra (Genie-TTS) 部署在 Win :5000，流式返回 raw PCM 32kHz
  tts-engine: astra
  # Astra TTS 服务基础 URL（Win 主机）
  astra-tts-base-url: http://192.168.124.2:5000
  # 默认 avatarId（兜底音色，Astra 服务端已配置）
  astra-default-avatar-id: chenxing
  # 流式分片大小（chunkSize 参数）
  astra-streaming-chunk-size: 2048
  # 单次 TTS 超时（毫秒）
  tts-timeout-ms: 60000
  # 默认音色 profile（当角色卡 voice_id 没匹配到 profile 时用这个）
  tts-default-profile: shu
  # 音色库 —— key 必须和 role_card.voice_id 一致即可直接命中
  tts-profiles:
    shu:
      display-name: "黍（默认）"
      # Astra avatarId：对应 Win 上 TTS 服务注册的音色
      astra-avatar-id: Shu_v2proplus
      text-lang: zh
      speed-factor: 1.0
      temperature: 1.0
      top-k: 15
    # 占位角色：暂时复用黍音色
    m3_v1: { display-name: "m3(复用黍)", alias-of: shu }
    hiro_v1: { display-name: "二阶堂希罗(复用黍)", alias-of: shu }
