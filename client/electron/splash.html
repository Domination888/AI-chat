<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI-Chat 启动中</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box { text-align: center; padding: 24px; }
    .title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .status { font-size: 13px; color: #9ca3af; min-height: 20px; }
    .spinner {
      width: 28px; height: 28px; margin: 16px auto 0;
      border: 3px solid #374151; border-top-color: #60a5fa;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">AI-Chat 正在启动服务</div>
    <div class="status" id="status">准备中...</div>
    <div class="spinner"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash-status', (_e, msg) => {
      document.getElementById('status').textContent = msg;
    });
  </script>
</body>
</html>
