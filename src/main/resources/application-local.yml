    url: jdbc:mysql://localhost:3306/ai_chat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: meng050319

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.aichat.dto
  configuration:
    map-underscore-to-camel-case: true

mcp:
  zhipu:
    search-url: https://open.bigmodel.cn/api/mcp/web_search/sse
    api-key: b10d5aa03c3348b688c51fc00cd4dbfb.uFxrmeRwiuFGNhpe
  local:
    enabled: true
    # prime-mcp-server fat jar 路径；支持：
    #   1) 相对路径（相对后端启动时的工作目录，默认就是项目根）
    #   2) 绝对路径
    #   3) 环境变量 PRIME_MCP_JAR 覆盖（最高优先级）
    # 修改打包规则前：cd prime-mcp-server && ../mvnw package
    jar-path: ${PRIME_MCP_JAR:prime-mcp-server/target/prime-mcp-server-1.0.0.jar}
    # 启动命令的前缀（逗号分隔）；默认 java -jar，可改为 java,-Xmx256m,-jar 等
    java-args: "java,-jar"

rag:
  chunk-size: 500
  chunk-overlap: 80
  max-context-chars: 2400
  embedding-batch-size: 32
  # RAG 启动策略：
  #   true  = 启动时若 Redis 缓存为空，则后台异步向量化（不阻塞应用启动），
  #            首次提问到达时若仍未完成则同步等待最多 30s；之后命中 Redis 缓存秒级就绪
  #   false = 只读 Redis；缓存为空就让 RAG 一直空索引，需手动 POST /api/rag/reload
  # 默认 true：项目所有角色卡 + 长期记忆都依赖 RAG，关闭等于"忘记角色设定"
  eager-init: true
  # 启动时是否强制重建 RAG 缓存：
  #   true（默认）= 每次启动都后台异步重新扫描 personas/*/lore + memory_cards 并向量化，
  #                 新结果完成后无缝替换内存索引；
  #                 启动期会先用 Redis 旧缓存垫底，避免重建中检索全空
  #   false       = 走旧逻辑：Redis 命中即停，未命中再视 eager-init 决定是否预热
  # 开发期改 persona/memory_cards 后重启就能生效，不需要再 POST /api/rag/reload
  force-rebuild-on-startup: true

llm:
  # Win 机 LM Studio (Gemma4-31B Dense, GGUF Q4/Q5, ctx_len=8192)，OpenAI 兼容；规则强约束：LLM 必须走 Win
  # 上下文长度策略：后端自管 prompt 装配，发到 LLM 的 token 控制在 7K 内，LM Studio 侧 ctx_len 配 8K 即可（不要拉到 256K）
  base-url: http://192.168.124.2:1234/v1
  model-name: gemma-4-31b-it
  streaming-model-name: gemma-4-31b-it
  # 连接超时给短一点，连不上秒失败；读超时给大模型留够吐字时间
  connect-timeout-ms: 3000
  read-timeout-ms: 60000
  # 出错重试；langchain4j 默认 3 次，收敛到 1 次避免启动期日志刷屏
  max-retries: 1

embedding:
  # 严格约束：Embedding 必须常驻 Mac（Win 显存被 Gemma4-31B 占满，不能再叠加 GPU 服务）
  # 当前过渡期暂走 Win LM Studio 的 embedding 接口；后续切到 Mac 本机 MLX bge-small-zh / bge-m3
  # 见 .joycode/rules/00-hardware-and-deployment.md
  base-url: http://127.0.0.1:1234/v1
  model-name: text-embedding-embeddinggemma-300m

voice:
  # SenseVoice 本机批处理接口（PLAN-002 已部署，launchd 托管）
  asr-url: http://127.0.0.1:9000/v1/audio/transcriptions
  asr-language: auto
  asr-timeout-ms: 15000
  # ---------------- TTS (GPT-SoVITS api_v2) ----------------
  # base-url 指向本机 GPT-SoVITS api_v2 (推荐 9880)
  tts-base-url: http://127.0.0.1:9880
  # 首次调用前是否自动尝试切换一次权重（只切一次，避免每次请求都切）
  tts-auto-switch-weights: true
  # 流式块大小：1=最高音质（不流式）/ 2=中等（流式，不强切）/ 3=最快（流式 + 定长硬切，会断词）
  # 实测 3 会切碎词导致吐字含糊，2 是音质/速度的最佳平衡，详见 PLAN-007
  tts-streaming-mode: 2
  # 单次 TTS 超时（毫秒），整段最长合成时间
  tts-timeout-ms: 60000
  # 默认音色 profile（当角色卡 voice_id 没匹配到 profile 时用这个）
  tts-default-profile: shu
  # 音色库 —— key 必须和 role_card.voice_id 一致即可直接命中
  tts-profiles:
    shu:
      display-name: "黍（默认）"
      # 参考音频：绝对路径，GPT-SoVITS 服务端读取本机文件
      ref-audio-path: ${user.dir}/v4/黍/reference_audios/中文/emotions/【默认】让我看看我带来的这些渔具放到哪里好呢？.wav
      prompt-text: "让我看看我带来的这些渔具放到哪里好呢？"
      prompt-lang: zh
      text-lang: zh
      # 训练出来的 GPT / SoVITS 权重（绝对路径），后端启动后会调用 /set_gpt_weights & /set_sovits_weights 切换
      # 注意：当前 GPT-SoVITS 服务侧的底模是 v2Pro（见 GPT-SoVITS/GPT_SoVITS/configs/tts_infer.yaml），
      # 黍的 v4 LoRA 权重直接挂到 v2Pro 底模上跑，速度快很多（详见 PLAN-007）
      gpt-weights: ${user.dir}/v4/黍/黍-e10.ckpt
      sovits-weights: ${user.dir}/v4/黍/黍_e10_s190_l32.pth
      # 推理参数严格对齐 GPT-SoVITS webui "1C-推理" 页设置（详见 .joycode/memory/feedback_tts_params.md）
      # webui 截图实测：top_k=15, top_p=1, temperature=1, 语速=1, 句间停顿=0.3, 采样步数=8, 切分=凑四句一切
      top-k: 15
      top-p: 1.0
      temperature: 1.0
      speed-factor: 1.0
      fragment-interval: 0.3
      # v2Pro 关键：sample_steps webui 用 8，api_v2 默认 32 —— 漏传/用 32 会慢 4 倍 + 音色漂
      sample-steps: 8
      # "凑四句一切" 对应 cut1（cut5 是按标点切，会让黍模型断句异常）
      text-split-method: cut1
    # 兜底：角色卡里预置的 voice_id (liuli_v1/xingye_v1/k_v1) 暂时都复用黍
    liuli_v1: { display-name: "琉璃(复用黍)", alias-of: shu }
    xingye_v1: { display-name: "星野(复用黍)", alias-of: shu }
    k_v1: { display-name: "赛博K(复用黍)", alias-of: shu }